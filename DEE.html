<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Classroom Hazard Detection</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; }
    #webcam-container { margin: 15px auto; }
    #status { font-size: 1.2rem; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>📷 ตรวจจับวัตถุอันตรายในชั้นเรียน</h2>
  <button type="button" onclick="init()">เปิดกล้องและเริ่มตรวจจับ</button>
  <div id="webcam-container"></div>
  <div id="status">สถานะ: รอเปิดกล้อง</div>

  <script type="text/javascript">
    // 1. ใส่ URL ของโมเดลจาก Teachable Machine
    const URL = "https://teachablemachine.withgoogle.com/models/ใส่_MODEL_ID_ของคุณ/";
    
    // 2. ใส่ Production Webhook URL จาก n8n
    const N8N_WEBHOOK_URL = "http://localhost:5678/webhook/detect-hazard";

    let model, webcam, labelContainer, maxPredictions;
    let isCooldown = false; // ป้องกันการส่งแจ้งเตือนซ้ำรัวๆ

    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      document.getElementById("status").innerText = "กำลังโหลดโมเดล...";
      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      // เปิดกล้องมือถือ/เว็บแคม
      const flip = true; 
      webcam = new tmImage.Webcam(320, 240, flip);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);

      document.getElementById("webcam-container").appendChild(webcam.canvas);
      document.getElementById("status").innerText = "ระบบกำลังทำงาน...";
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      
      for (let i = 0; i < maxPredictions; i++) {
        const className = prediction[i].className;
        const probability = prediction[i].probability;

        // ถ้าพบวัตถุอันตราย ความมั่นใจเกิน 80% และไม่อยู่ในช่วง Cooldown
        if (className === "Hazard" && probability > 0.80 && !isCooldown) {
          triggerAlert(webcam.canvas.toDataURL("image/jpeg"), probability);
          break;
        }
      }
    }

    async function triggerAlert(base64Image, confidence) {
      isCooldown = true;
      document.getElementById("status").innerText = "⚠️ ตรวจพบวัตถุเสี่ยง กำลังส่งตรวจสอบ...";

      try {
        await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            object: "suspected_hazard",
            confidence: confidence,
            image_base64: base64Image
          })
        });
        document.getElementById("status").innerText = "ส่งข้อมูลสำเร็จ รอดำเนินการต่อไป...";
      } catch (err) {
        console.error("ส่งข้อมูลล้มเหลว:", err);
      }

      // หน่วงเวลา 10 วินาทีก่อนตรวจจับครั้งถัดไป เพื่อไม่ให้ยิงรัวเกินไป
      setTimeout(() => {
        isCooldown = false;
        document.getElementById("status").innerText = "ระบบกำลังทำงาน...";
      }, 10000);
    }
  </script>
</body>
</html>
